<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#151b16">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{{ page.title | default: site.title }}{% if page.title %} — {{ site.title }}{% endif %}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main-content">İçeriğe geç</a>

  <div class="site">
    <header class="site-header">
      <div class="header-top">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="Oyun-Rehberi ana sayfası">
          <span class="brand-mark" aria-hidden="true"><span class="brand-hatch"></span></span>
          <span class="brand-copy">
            <span class="brand-kicker">OYUNCUSEMPANZE</span>
            <span class="brand-title">{{ site.title }}</span>
          </span>
        </a>

        <nav aria-label="Ana gezinme">
          <a href="{{ '/' | relative_url }}#archive">Arşivdeki oyunlar <span aria-hidden="true">↘</span></a>
        </nav>
      </div>

      <p class="site-description">{{ site.description }}</p>
    </header>

    <main class="content" id="main-content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <span class="footer-brand"><span class="footer-mark" aria-hidden="true"></span> OyuncuSempanze</span>
      <span class="footer-note">Kaynaklı oyun bilgileri <span aria-hidden="true">·</span> Türkçe arşiv</span>
    </footer>
  </div>
</body>
</html>
