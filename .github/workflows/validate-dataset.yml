name: Validate dataset

on:
  push:
    paths:
      - "oyunlar/**/*.md"
      - "scripts/build_dataset.py"
      - "scripts/validate_dataset_schema.py"
      - "veri-kumeleri/**"
      - ".github/workflows/validate-dataset.yml"
  pull_request:
    paths:
      - "oyunlar/**/*.md"
      - "scripts/build_dataset.py"
      - "scripts/validate_dataset_schema.py"
      - "veri-kumeleri/**"
      - ".github/workflows/validate-dataset.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate dataset, schema and local links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check exports and local Markdown links
        run: python scripts/build_dataset.py --check

      - name: Install JSON Schema validator
        run: python -m pip install jsonschema

      - name: Validate JSONL records against the schema
        run: python scripts/validate_dataset_schema.py
