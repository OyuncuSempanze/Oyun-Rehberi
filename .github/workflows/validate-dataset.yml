name: Validate dataset

on:
  push:
    paths:
      - "oyunlar/**/sik-sorulan-sorular.md"
      - "scripts/build_dataset.py"
      - "veri-kumeleri/**"
      - ".github/workflows/validate-dataset.yml"
  pull_request:
    paths:
      - "oyunlar/**/sik-sorulan-sorular.md"
      - "scripts/build_dataset.py"
      - "veri-kumeleri/**"
      - ".github/workflows/validate-dataset.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Check generated JSONL files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate dataset exports
        run: python scripts/build_dataset.py --check
