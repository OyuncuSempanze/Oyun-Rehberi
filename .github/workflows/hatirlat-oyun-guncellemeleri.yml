name: Oyun güncelleme hatırlatıcısı

on:
  schedule:
    # Her pazartesi Türkiye saatiyle 11.00 (08.00 UTC).
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  remind:
    name: Kontrol zamanı gelen oyunları hatırlat
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Takvimi değerlendir ve Türkçe hatırlatma oluştur
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const tracker = JSON.parse(
              fs.readFileSync(".github/oyun-guncelleme-takibi.json", "utf8")
            );
            const timeZone = tracker.timezone || "Europe/Istanbul";
            const formatter = new Intl.DateTimeFormat("en-CA", {
              timeZone,
              year: "numeric",
              month: "2-digit",
              day: "2-digit"
            });

            function dateInTimeZone(date) {
              const parts = Object.fromEntries(
                formatter.formatToParts(date)
                  .filter(part => part.type !== "literal")
                  .map(part => [part.type, part.value])
              );
              return `${parts.year}-${parts.month}-${parts.day}`;
            }

            function daysBetween(startDate, endDate) {
              const start = Date.parse(`${startDate}T00:00:00Z`);
              const end = Date.parse(`${endDate}T00:00:00Z`);
              return Math.floor((end - start) / 86400000);
            }

            const today = dateInTimeZone(new Date());

            for (const game of tracker.games) {
              if (!Number.isInteger(game.interval_days) || game.interval_days < 1) {
                throw new Error(`${game.name} için kontrol aralığı geçersiz.`);
              }
              if (game.last_checked && !Number.isFinite(Date.parse(`${game.last_checked}T00:00:00Z`))) {
                throw new Error(`${game.name} için kontrol tarihi geçersiz.`);
              }
            }

            const dueGames = tracker.games.filter(game => {
              if (!game.last_checked) return true;
              return daysBetween(game.last_checked, today) >= game.interval_days;
            });

            const { owner, repo } = context.repo;
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100
            });
            const reminder = openIssues.find(issue =>
              !issue.pull_request &&
              issue.title === tracker.issue_title &&
              (issue.body || "").includes("<!-- oyun-guncelleme-takibi")
            );

            const dueIds = dueGames.map(game => game.id).sort();
            const marker = `<!-- oyun-guncelleme-takibi due-games:${dueIds.join(",")} -->`;

            function gameDetails(game) {
              const age = game.last_checked ? daysBetween(game.last_checked, today) : null;
              const lastCheck = game.last_checked
                ? `${game.last_checked} (${age} gün önce)`
                : "Kayıtlı değil, ilk kontrol gerekli";
              const reason = !game.last_checked
                ? "İlk kontrol tarihi henüz kaydedilmemiş."
                : `Kontrol aralığı ${game.interval_days} gün ve son kontrolden ${age} gün geçmiş.`;
              const sources = game.sources
                .map(source => `[${source.label}](${source.url})`)
                .join(" · ");

              return [
                `### ${game.name}`,
                `- Son kayıtlı kontrol: ${lastCheck}`,
                `- Neden listede: ${reason}`,
                `- Kontrol kaynakları: ${sources}`
              ].join("\n");
            }

            const body = dueGames.length
              ? [
                  marker,
                  "## Kontrol zamanı gelen oyunlar",
                  "",
                  `**Kontrol tarihi:** ${today} (Türkiye saati)`,
                  "",
                  "Bu hatırlatıcı yalnızca kontrol zamanını takip eder. Kaynak sayfaları otomatik taramaz ve oyunun güncellendiğini kendi başına doğrulamaz.",
                  "",
                  ...dueGames.map(gameDetails),
                  "",
                  "## Kontrolü tamamlamak için",
                  "",
                  "1. Yukarıdaki resmî kaynakları aç ve önceki kontrol tarihinden sonra yeni sürüm veya önemli değişiklik olup olmadığını incele.",
                  "2. Değişiklik varsa ilgili rehberi güncelle. Değişiklik yoksa rehberi değiştirmek gerekmez.",
                  "3. `.github/oyun-guncelleme-takibi.json` dosyasındaki oyunun `last_checked` alanını kontrol yaptığın Türkiye tarihiyle güncelle ve değişikliği ana dala al.",
                  "",
                  "Kontrol tarihi güncellendiğinde bu hatırlatma, takip aralığı dolmamışsa otomatik olarak kapanır."
                ].join("\n")
              : [
                  "<!-- oyun-guncelleme-takibi due-games: -->",
                  "## Şu anda kontrol zamanı gelen oyun yok",
                  "",
                  `**Son değerlendirme:** ${today} (Türkiye saati)`,
                  "",
                  "Takip dosyasındaki tarihlere göre hiçbir oyunun kontrol aralığı dolmadı. Yeni bir kontrol gerektiğinde sistem yeni bir hatırlatma oluşturacak."
                ].join("\n");

            if (dueGames.length > 0) {
              if (reminder) {
                const oldMatch = (reminder.body || "").match(/<!-- oyun-guncelleme-takibi due-games:([^>]*) -->/);
                const oldIds = new Set((oldMatch ? oldMatch[1] : "").split(",").filter(Boolean));
                const newlyDue = dueGames.filter(game => !oldIds.has(game.id));

                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: reminder.number,
                  body
                });

                if (newlyDue.length > 0) {
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: reminder.number,
                    body: `Yeni kontrol zamanı gelen oyunlar var: ${newlyDue.map(game => game.name).join(", ")}. Hatırlatmanın güncel listesi için issue açıklamasını incele.`
                  });
                }

                core.summary
                  .addHeading("Oyun güncelleme kontrolü")
                  .addParagraph(`Kontrol tarihi: ${today} (Türkiye saati).`)
                  .addParagraph(`${dueGames.length} oyun için kontrol zamanı geldi. Açık hatırlatma güncellendi.`)
                  .addLink("Hatırlatmayı aç", reminder.html_url);
              } else {
                const created = await github.rest.issues.create({
                  owner,
                  repo,
                  title: tracker.issue_title,
                  body
                });

                core.summary
                  .addHeading("Oyun güncelleme kontrolü")
                  .addParagraph(`Kontrol tarihi: ${today} (Türkiye saati).`)
                  .addParagraph(`${dueGames.length} oyun için kontrol zamanı geldi. Türkçe bir hatırlatma oluşturuldu.`)
                  .addLink("Hatırlatmayı aç", created.data.html_url);
              }
            } else {
              if (reminder) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: reminder.number,
                  state: "closed",
                  body
                });
              }

              core.summary
                .addHeading("Oyun güncelleme kontrolü")
                .addParagraph(`Kontrol tarihi: ${today} (Türkiye saati).`)
                .addParagraph("Kontrol zamanı gelen oyun yok. Yeni bir hatırlatma gerekmiyor.");
            }

            await core.summary.write();
